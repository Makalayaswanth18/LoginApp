<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A clean, responsive login page demo.">
  <title>Login in</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #172033;
      --muted: #687386;
      --line: #dce2eb;
      --brand: #4f46e5;
      --brand-dark: #4338ca;
      --surface: #ffffff;
      --page: #f4f6fb;
      --danger: #c62828;
      --success: #18794e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 12% 12%, rgba(99,102,241,.13), transparent 30%),
        radial-gradient(circle at 88% 86%, rgba(14,165,233,.12), transparent 28%),
        var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .login-card {
      width: min(100%, 440px);
      padding: 42px;
      background: var(--surface);
      border: 1px solid rgba(220,226,235,.9);
      border-radius: 22px;
      box-shadow: 0 22px 70px rgba(29, 41, 68, .10);
    }
    .brand-mark {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      margin-bottom: 28px;
      border-radius: 14px;
      background: var(--brand);
      color: white;
      font-size: 22px;
      font-weight: 800;
    }
    h1 { margin: 0 0 9px; font-size: 29px; letter-spacing: -1px; }
    .subtitle { margin: 0 0 30px; color: var(--muted); line-height: 1.55; }
    .field { margin-bottom: 19px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 650; }
    .input-wrap { position: relative; }
    input[type="email"], input[type="password"], input[type="text"] {
      width: 100%;
      height: 50px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 11px;
      outline: none;
      color: var(--ink);
      background: #fff;
      font: inherit;
      transition: border-color .18s, box-shadow .18s;
    }
    input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(79,70,229,.13);
    }
    input::placeholder { color: #9aa3b2; }
    .password-input { padding-right: 76px !important; }
    .show-password {
      position: absolute;
      top: 50%;
      right: 12px;
      transform: translateY(-50%);
      padding: 6px 4px;
      border: 0;
      background: transparent;
      color: var(--brand);
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 650;
    }
    .form-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 2px 0 23px;
      font-size: 13px;
    }
    .remember {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      margin: 0;
    }
    .remember input { accent-color: var(--brand); width: 15px; height: 15px; }
    a { color: var(--brand); text-decoration: none; font-weight: 650; }
    a:hover { text-decoration: underline; }
    .primary-btn, .google-btn {
      width: 100%;
      min-height: 50px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      border-radius: 11px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s, transform .18s;
    }
    .primary-btn {
      border: 0;
      background: var(--brand);
      color: white;
    }
    .primary-btn:hover { background: var(--brand-dark); }
    .primary-btn:active, .google-btn:active { transform: translateY(1px); }
    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 23px 0;
      color: #929bad;
      font-size: 12px;
    }
    .divider::before, .divider::after {
      content: "";
      height: 1px;
      flex: 1;
      background: var(--line);
    }
    .google-btn {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
    }
    .google-btn:hover { background: #f8f9fc; }
    .google-g { font-size: 18px; font-weight: 800; color: #4285f4; }
    .signup { margin: 25px 0 0; text-align: center; color: var(--muted); font-size: 14px; }
    .message {
      display: none;
      margin: 0 0 17px;
      padding: 11px 13px;
      border-radius: 9px;
      background: #fff1f1;
      color: var(--danger);
      font-size: 13px;
      line-height: 1.45;
    }
    .message.success { background: #ecfdf3; color: var(--success); }
    .fine-print { margin: 24px 0 0; text-align: center; color: #9aa3b2; font-size: 11px; line-height: 1.5; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid rgba(79,70,229,.35);
      outline-offset: 3px;
    }
    @media (max-width: 520px) {
      body { padding: 16px; }
      .login-card { padding: 30px 23px; border-radius: 18px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand-mark" aria-hidden="true">A</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Sign in to your account to continue.</p>

    <div id="message" class="message" role="status" aria-live="polite"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" placeholder="you@example.com"
               autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <input class="password-input" id="password" name="password" type="password"
                 placeholder="Enter your password" autocomplete="current-password"
                 minlength="8" required>
          <button class="show-password" id="togglePassword" type="button"
                  aria-controls="password" aria-pressed="false">Show</button>
        </div>
      </div>

      <div class="form-options">
        <label class="remember" for="remember">
          <input id="remember" name="remember" type="checkbox">
          Remember me
        </label>
        <a href="#" id="forgotLink">Forgot password?</a>
      </div>

      <button class="primary-btn" type="submit">Sign in</button>
    </form>

    <div class="divider">OR</div>

    <button class="google-btn" id="googleButton" type="button">
      <span class="google-g" aria-hidden="true">G</span>
      Continue with Google
    </button>

    <p class="signup">Don't have an account? <a href="#" id="signupLink">Create account</a></p>
    <p class="fine-print">By continuing, you agree to our Terms of Service and Privacy Policy.</p>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const password = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const message = document.getElementById('message');

    function showMessage(text, isSuccess = false) {
      message.textContent = text;
      message.classList.toggle('success', isSuccess);
      message.style.display = 'block';
    }

    togglePassword.addEventListener('click', () => {
      const isHidden = password.type === 'password';
      password.type = isHidden ? 'text' : 'password';
      togglePassword.textContent = isHidden ? 'Hide' : 'Show';
      togglePassword.setAttribute('aria-pressed', String(isHidden));
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;
      showMessage('Form looks good! Connect this page to your authentication backend to sign in.', true);
    });

    document.getElementById('forgotLink').addEventListener('click', (event) => {
      event.preventDefault();
      showMessage('Password reset is a demo here. Connect a password-reset flow to make this link work.');
    });

    document.getElementById('signupLink').addEventListener('click', (event) => {
      event.preventDefault();
      showMessage('Create-account is a demo link. Add your registration page or route here.');
    });

    document.getElementById('googleButton').addEventListener('click', () => {
      showMessage('Google sign-in is not connected yet. Add Google OAuth authentication to enable it.');
    });
  </script>
</body>
</html>
